name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest mailclient/tests -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Signaler les tests en échec
        # Chaque échec devient une annotation, visible dans la pull request sans ouvrir les journaux.
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          if not Path('test-results.xml').exists():
              print('::error title=pytest::Aucun rapport : erreur avant la collecte des tests.')
          else:
              for case in ET.parse('test-results.xml').iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      title = f"{case.get('classname')}.{case.get('name')}"
                      detail = (problem.get('message') or '') + '\n' + (problem.text or '')[-1500:]
                      detail = detail.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f'::error title={title}::{detail}')

  build:
    name: Exécutable Windows
    needs: tests
    runs-on: windows-latest
    env:
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Construire
        run: python -m PyInstaller --clean --noconfirm Smail.spec
      - name: Diagnostic de l’exécutable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process .\dist\Smail\Smail.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Diagnostic en échec : code $($p.ExitCode)" }
      - name: Construire l’installateur
        shell: pwsh
        run: |
          $version = (Select-String -Path mailclient/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer\Smail.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC en échec : $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: Smail-windows
          path: dist/Smail
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Smail-installateur
          path: dist/installer/*.exe
          retention-days: 14
